# Local development database. Tests do not need this: they start an
# embedded Postgres themselves.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hale
      POSTGRES_PASSWORD: hale
      POSTGRES_DB: hale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
