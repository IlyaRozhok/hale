name: Deploy
# Manual only. This workflow never runs on push; the owner triggers it from the
# Actions tab after completing the steps in infra/README.md.
on:
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t tablo-api:${{ github.sha }} .
      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Ship image and infra files
        run: |
          SSH="ssh -i ~/.ssh/id -o StrictHostKeyChecking=yes root@$HOST"
          docker save tablo-api:${{ github.sha }} | gzip | $SSH 'gunzip | docker load'
          scp -i ~/.ssh/id -o StrictHostKeyChecking=yes -r infra/compose.yml infra/Caddyfile infra/backup.sh infra/restore-check.sh infra/cron-run.sh infra/tablo.cron root@$HOST:/opt/tablo/infra/
      - name: Start
        run: |
          SSH="ssh -i ~/.ssh/id -o StrictHostKeyChecking=yes root@$HOST"
          $SSH 'set -e; cd /opt/tablo/infra
            sed -i "/^API_IMAGE=/d" .env; echo "API_IMAGE=tablo-api:${{ github.sha }}" >> .env
            chmod +x *.sh; install -m 644 tablo.cron /etc/cron.d/tablo
            docker compose up -d --remove-orphans'
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://${{ secrets.DEPLOY_DOMAIN }}/health" && exit 0
            sleep 5
          done
          echo "health check failed" >&2; exit 1
