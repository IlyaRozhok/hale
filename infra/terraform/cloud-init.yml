#cloud-config
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - age
  - rclone
  - cron
  - unattended-upgrades
  - postgresql-client
write_files:
  - path: /etc/ssh/sshd_config.d/10-hale.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin prohibit-password
runcmd:
  - systemctl enable --now docker cron
  - systemctl restart ssh
  - mkdir -p /opt/hale/infra
